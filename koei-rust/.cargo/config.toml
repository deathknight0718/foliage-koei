# ============================================================================
# Foliage-QaaS Rust 工作空间构建配置
# ============================================================================

# -----------------------------------------------------------------------------
# WASM 目标配置
# -----------------------------------------------------------------------------
[target.wasm32-unknown-unknown]
rustflags = [
    "-C", "target-feature=+simd128",      # WASM SIMD 128 位向量指令
    "-C", "opt-level=3",                  # 最大性能优化
]

# -----------------------------------------------------------------------------
# Windows x86_64 配置
# -----------------------------------------------------------------------------
[target.x86_64-pc-windows-msvc]
rustflags = [
    "-C", "target-cpu=x86-64-v3",         # 使用本机 CPU 特性
    "-C", "target-feature=+avx2,+fma",    # 卡尔曼滤波加速
]

# -----------------------------------------------------------------------------
# Linux 平台 配置
# -----------------------------------------------------------------------------
[target.x86_64-unknown-linux-gnu]
rustflags = [
    "-C", "target-cpu=x86-64-v3",
    "-C", "target-feature=+avx2,+fma",
]