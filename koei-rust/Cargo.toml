[workspace]
members = [
    "koei-san14",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
authors = ["Foliage Koei Mod Team"]
edition = "2024"

[workspace.dependencies]
anyhow = { version = "1.0.100" }
approx = { version = "0.5.1" }
arrow = { version = "58.3.0" }
async-stream = { version = "0.3.6" }
async-trait = { version = "0.1.89" }
axum = { version = "0.8.7", features = ["ws"] }
axum-extra = { version = "0.12.3" }
base64 = { version = "0.21.1" }
binrw = { version = "0.15.2" }
brotli = { version = "8.0.4" }
byteorder = { version = "1.5.0" }
bytes = { version = "1.11.1", features = ["serde"] }
chrono = { version = "0.4.41", features = ["serde"], default-features = false }
clap = { version = "4.0", features = ["derive"] }
compact_str = { version = "0.9.0", features = ["serde", "bytes"] }
console-subscriber = { version = "0.5.0" }
console_error_panic_hook = { version = "0.1.7" }
cookie = { version = "0.18.1" }
criterion = { version = "0.7.0", features = ["html_reports"] }
csv = { version = "1.3.1" }
dashmap = { version = "6.1.0" }
deadpool = { version = "0.12.3" }
deadpool-postgres = { version = "0.14.1" }
dotenvy = { version = "0.15.7" }
encoding_rs = { version = "0.8.35" }
flate2 = { version = "1.1.4", features = ["rust_backend"], default-features = false }
flume = { version = "0.12.0" }
futures-util = { version = "0.3.31" }
getrandom = { version = "0.3.4" }
glam = { version = "0.33.3" }
headers = { version = "0.4.1" }
hmac = { version = "0.12.1" }
indexmap = { version = "2.13.0" }
indextree = { version = "4.8.1" }
insta = { version = "1.43.2" }
interprocess = { version = "2.4.2", features = ["tokio"] }
itertools = { version = "0.14.0" }
js-sys = { version = "0.3.81" }
jsonwebtoken = { version = "10.2.0", features = ["rust_crypto"] }
lazy_static = { version = "1.5.0" }
ldap3 = { version = "0.12.1" }
libloading = { version = "0.9.0" }
mime = { version = "0.3.17" }
minhook = { version = "0.9.0" }
moka = { version = "0.12.11" }
nalgebra = { version = "0.34.1", features = ["std", "matrixmultiply"] }
ndarray = { version = "0.17.1", features = ["blas"] }
notify-rust = { version = "4.11.7" }
numpy = { version = "0.27" }
once_cell = { version = "1.21.3" }
openssl = { version = "0.10.75" }
ort = { version = "2.0.0-rc.10" }
paho-mqtt = { version = "0.13.3" }
petgraph = { version = "0.8.3" }
polars = { version = "0.53.0", features = ["fmt", "lazy"], default-features = false }
prost = { version = "0.14.3" }
pyo3 = { version = "0.27.1", features = ["extension-module"] }
rand = { version = "0.9.2" }
rand_distr = { version = "0.5.1" }
redb = { version = "4.1.0" }
reqwest = { version = "0.12.24", features = ["json", "native-tls"], default-features = false }
rmp-serde = { version = "1.3.1" }
rumqttc = { version = "0.25.1", default-features = false }
rust_decimal = { version = "1.37" }
rust_decimal_macros = { version = "1.37" }
serde = { version = "1.0.228", features = ["derive"] }
serde-wasm-bindgen = { version = "0.6.5" }
serde_json = { version = "1.0.145" }
serde_qs = { version = "0.15.0", features = ["axum"] }
serde_urlencoded = { version = "0.7.1" }
sha2 = { version = "0.10.9" }
sherpa-rs = { version = "0.6.8" }
snowflake = { version = "1.3.0" }
subtle = { version = "2.6.1" }
thiserror = { version = "2.0.17" }
tokio = { version = "1.48.0", features = ["full"] }
tokio-cron-scheduler = { version = "0.15.1" }
tokio-postgres = { version = "0.7.15", features = ["with-chrono-0_4", "with-serde_json-1", "with-uuid-1"] }
tokio-stream = { version = "0.1.17" }
toml = { version = "1.1.2", features = ["serde"] }
tonic = { version = "0.14.5" }
tonic-build = { version = "0.14.5" }
tonic-prost = { version = "0.14.5" }
tonic-prost-build = { version = "0.14.5" }
tower = { version = "0.5.2" }
tower-http = { version = "0.6.6", features = ["compression-gzip", "compression-br", "trace", "cors", "fs"] }
tower-sessions = { version = "0.14.0" }
tower-sessions-moka-store = { version = "0.15.0" }
tracing = { version = "0.1.41" }
tracing-appender = { version = "0.2.5" }
tracing-subscriber = { version = "0.3.20" }
tracing-wasm = { version = "0.2.1" }
trait-variant = { version = "0.1.2" }
url = { version = "2.5.7" }
urlencoding = { version = "2.1.3" }
uuid = { version = "1.18.1" }
wasm-bindgen = { version = "0.2.104" }
wasm-bindgen-test = { version = "0.3.54" }
web-sys = { version = "0.3.81", features = ["console"] }
web-time = { version = "1.1.0" }
winapi = { version = "0.3.9" }
windows-sys = { version = "0.61.2" }
zstd = { version = "0.13.3" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4

[profile.dev]
opt-level = 0
debug = 2

[profile.bench]
debug = true
